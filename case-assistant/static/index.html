<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Case assistant</title>
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <symbol id="i-scale" viewBox="0 0 24 24"><path d="M12 3v18M5 21h14M7 7h10M7 7l-3 7h6l-3-7Zm10 0-3 7h6l-3-7Z"/></symbol>
    <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></symbol>
    <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></symbol>
    <symbol id="i-people" viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0M16 4.5a3.5 3.5 0 0 1 0 7M21.5 20a6.5 6.5 0 0 0-4-6"/></symbol>
    <symbol id="i-file" viewBox="0 0 24 24"><path d="M6 3h8l4 4v14H6zM14 3v4h4M9 12h6M9 16h6"/></symbol>
    <symbol id="i-statement" viewBox="0 0 24 24"><path d="M6 3h8l4 4v14H6zM14 3v4h4M9 13l2 2 4-4"/></symbol>
    <symbol id="i-interview" viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></symbol>
    <symbol id="i-messages" viewBox="0 0 24 24"><path d="M4 5h16v11H9l-5 4z"/></symbol>
    <symbol id="i-email" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></symbol>
    <symbol id="i-report" viewBox="0 0 24 24"><path d="M6 3h12v18H6zM9 8h6M9 12h6M9 16h3"/></symbol>
    <symbol id="i-letter" viewBox="0 0 24 24"><path d="M5 4h14v16H5zM8 8h8M8 12h8M8 16h5"/></symbol>
    <symbol id="i-calendar" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></symbol>
    <symbol id="i-back" viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></symbol>
    <symbol id="i-chat" viewBox="0 0 24 24"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12Z"/></symbol>
    <symbol id="i-send" viewBox="0 0 24 24"><path d="m4 12 16-8-6 16-2-7-8-1Z"/></symbol>
    <symbol id="i-close" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
  </svg>

  <header class="topbar">
    <div class="brand"><svg class="icon logo"><use href="#i-scale"/></svg><span>Case assistant</span></div>
    <div class="controls">
      <label class="field"><span>Case</span><select id="case"></select></label>
      <label class="field"><span>Answers</span>
        <select id="backend">
          <option value="openrouter">OpenRouter</option>
          <option value="retrieval">Sources only</option>
          <option value="local">Local model</option>
          <option value="reactor">Reactor (demo)</option>
        </select>
      </label>
      <label class="toggle" title="Adds a sentence embedder to keyword search, so paraphrases are found too">
        <input type="checkbox" id="semantic" checked><span class="track"></span><span>Semantic search</span>
      </label>
    </div>
  </header>

  <main>
    <section class="hero">
      <div>
        <div class="eyebrow" id="case-type"></div>
        <h1 id="case-title">Loading…</h1>
        <p class="summary" id="case-summary"></p>
      </div>
      <div class="stats" id="stats"></div>
    </section>

    <nav class="tabs" id="tabs">
      <a href="#chat" data-tab="chat"><svg class="icon"><use href="#i-chat"/></svg>Chat</a>
      <a href="#timeline" data-tab="timeline"><svg class="icon"><use href="#i-clock"/></svg>Timeline</a>
      <a href="#people" data-tab="people"><svg class="icon"><use href="#i-people"/></svg>People</a>
      <a href="#documents" data-tab="documents"><svg class="icon"><use href="#i-file"/></svg>Documents</a>
    </nav>

    <section id="view-chat" class="view"></section>
    <section id="view-timeline" class="view"></section>
    <section id="view-people" class="view"></section>
    <section id="view-documents" class="view"></section>
  </main>

  <aside class="drawer" id="drawer" aria-hidden="true">
    <div class="drawer-head">
      <div id="drawer-title"></div>
      <button class="iconbtn" id="drawer-close" title="Close"><svg class="icon"><use href="#i-close"/></svg></button>
    </div>
    <div class="drawer-body" id="drawer-body"></div>
  </aside>
  <div class="scrim" id="scrim"></div>

  <footer>
    Finds, orders and cites passages from the case file. It does not assess guilt or credibility:
    check every answer against its sources. Questions and answers are logged to the case's <code>audit.jsonl</code>.
  </footer>
  <script src="/static/app.js"></script>
</body>
</html>
